name: PR Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENGINE_LOCAL_MODE: "true"
      AUTH_SECRET: "ci-auth-secret"
      AUTH_URL: "http://localhost:3000"
      npm_config_fetch_retries: "5"
      npm_config_fetch_retry_factor: "2"
      npm_config_fetch_retry_mintimeout: "20000"
      npm_config_fetch_retry_maxtimeout: "120000"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Verify source of truth
        env:
          SOURCE_CHECK_OFFLINE: "true"
        run: npm run source:check

      - name: Confirm generated app schemas are inert
        run: npm run generated-apps:guard

      - name: Reject cloud-sync duplicate files
        run: npm run dupes:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: |
          # Ubuntu's own archive stops carrying postgresql-16 on newer runner
          # images. The PostgreSQL project's repository has it for every release.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-16
          npm test

      - name: Build
        run: npm run build

      - name: CRM smoke (church rule labels, saves fail closed, no secret in the bundle)
        run: npm run smoke:lpl-crm

      - name: Generated-app smoke (customer apps list what was bought; no placeholder copy, invented numbers or accounts)
        run: npm run smoke:generated-customer-copy

      - name: Generated-app database smoke (one Neon project per app, schema in public, applies to real Postgres)
        run: npm run smoke:generated-app-database

      - name: Recommendations smoke (real requests get the pack they need, no padding)
        run: npm run smoke:recommendations

      - name: Build-progress smoke (unwatched builds finish, owner emailed once, failed paid builds redone)
        run: npm run smoke:build-progress

      - name: App-usage smoke (busy apps told to upgrade once per level per month, owner queue)
        run: npm run smoke:app-usage

      - name: Flat-checkout smoke (server price, paid once, one build per order, money gate)
        run: npm run smoke:flat-checkout

      - name: Prove module combinations (church pack + all modules together, real browser + Postgres)
        run: |
          PGDIR="$(mktemp -d)"
          /usr/lib/postgresql/16/bin/initdb -D "$PGDIR/data" -A trust -U postgres > /dev/null
          /usr/lib/postgresql/16/bin/pg_ctl -D "$PGDIR/data" -o "-p 5546 -k $PGDIR -c max_connections=200" -w -l "$PGDIR/log" start
          npx playwright install --with-deps chromium > /dev/null
          PROVE_PG_URL=postgresql://postgres@127.0.0.1:5546/postgres npm run prove:modules -- --only=pack-church-org,all --concurrency=2
